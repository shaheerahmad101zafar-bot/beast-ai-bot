# Beast AI reverse proxy
# Set DOMAIN via host env when generating certs; default local hostnames below.

upstream beast_api {
    server beast_api:8000;
}

# HTTP — ACME challenge + redirect to HTTPS when certs exist
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # During first boot / local docker without certs, proxy HTTP directly.
        # After Let's Encrypt issuance, flip to: return 301 https://$host$request_uri;
        proxy_pass http://beast_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

