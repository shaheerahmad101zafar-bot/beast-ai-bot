# Beast AI — Render Blueprint (free staging / QA)
# Dashboard → New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: beast-ai-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: API_HOST
        value: "0.0.0.0"
      - key: BOT_AUTO_START
        # Free tier often has no always-on worker — keep scan loop on web for QA
        value: "true"
      - key: SITE_BASE_URL
        # Set after first deploy to https://YOUR-SERVICE.onrender.com
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: worker
    name: beast-ai-worker
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python run_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOT_AUTO_START
        value: "true"
      - key: JWT_SECRET
        fromService:
          name: beast-ai-web
          type: web
          envVarKey: JWT_SECRET
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SITE_BASE_URL
        sync: false
