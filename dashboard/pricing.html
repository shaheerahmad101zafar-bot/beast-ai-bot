<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Beast AI — Pricing & Checkout</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Manrope', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            ink: '#061017',
            fog: '#9BB0BF',
            teal: '#2DD4BF',
            sand: '#E7C08A',
            panel: '#0C1822',
            line: '#1B3142',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/landing.css" />
</head>
<body class="bg-ink text-white font-sans antialiased">
  <div class="noise" aria-hidden="true"></div>

  <header class="relative z-20">
    <div class="max-w-6xl mx-auto px-5 py-5 flex items-center justify-between">
      <a href="/" class="font-display text-2xl tracking-tight">Beast AI</a>
      <nav class="flex items-center gap-5 text-sm text-fog">
        <a href="/" class="hover:text-white">Home</a>
        <a href="/app" class="text-teal hover:text-white">Open App</a>
        <div class="social-links" data-social-links aria-label="Social links"></div>
      </nav>
    </div>
  </header>

  <main class="relative z-10 max-w-6xl mx-auto px-5 py-12">
    <div class="section-kicker">Billing</div>
    <h1 class="font-display text-4xl sm:text-5xl max-w-2xl leading-tight">Subscribe with card or USDT.</h1>
    <p class="mt-3 text-fog max-w-xl">Stripe Checkout for cards. NOWPayments invoices for USDT TRC20 / BEP20. Mock mode works without API keys.</p>

    <div class="mt-8 flex flex-wrap items-center gap-3">
      <span class="text-xs uppercase tracking-widest text-fog">Pay with</span>
      <div class="pay-toggle" role="group" aria-label="Payment method">
        <button type="button" class="pay-opt active" data-method="stripe">Credit Card (Stripe)</button>
        <button type="button" class="pay-opt" data-method="crypto">Pay with Crypto (USDT)</button>
      </div>
      <select id="crypto-network" class="watch-input !w-auto hidden">
        <option value="usdttrc20">USDT TRC20</option>
        <option value="usdtbsc">USDT BEP20</option>
      </select>
    </div>
    <p id="pay-status" class="mt-3 text-sm text-fog">Loading payment providers…</p>

    <div id="pricing-grid" class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-5"></div>
  </main>

  <footer class="relative z-10 border-t border-line mt-16">
    <div class="max-w-6xl mx-auto px-5 py-8 flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between text-sm text-fog">
      <div class="font-display text-white text-lg">Beast AI</div>
      <div class="social-links" data-social-links aria-label="Social links"></div>
      <div>
        <a class="text-teal" href="/">Landing</a> ·
        <a class="text-teal" href="/app">Open App</a>
      </div>
    </div>
  </footer>

  <script src="/static/social.js"></script>
  <script src="/static/pricing.js"></script>
  <script src="/static/pwa.js"></script>
  <script>
    if (window.BeastSocial) window.BeastSocial.hydrate();
  </script>
</body>
</html>
